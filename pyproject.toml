[project]
name = "proxy-bot"
version = "0.1.0"
description = "Telegram bot that hands out access links by code, with an admin panel"
readme = "README.md"
authors = [
    { name = "krozzzis", email = "schumov.nn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiogram-dialog>=2.6.0",
    "aiogram-i18n>=1.5",
    "emoji>=2.15.0",
    "fluent-compiler>=1.1",
    "python-dotenv>=1.2.2",
    "redis>=8.0.1",
    "tomli-w>=1.2.0",
    "watchfiles>=1.2.0",
]

[project.scripts]
proxy-bot = "proxy_bot:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
