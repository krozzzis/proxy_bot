name: proxy_bot

services:
  bot:
    build: .
    image: ghcr.io/krozzzis/proxy_bot:latest
    container_name: proxy_bot
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      ROOT_ADMIN_ID: ${ROOT_ADMIN_ID:?Set ROOT_ADMIN_ID in .env}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # FSM/dialog state storage: "sqlite" (default, no extra service needed)
      # or "redis" (start with --profile redis, see REDIS_URL below).
      FSM_BACKEND: ${FSM_BACKEND:-sqlite}
      REDIS_URL: ${REDIS_URL:-}
      # Optional: enables Remnawave panel sync (squad membership on code
      # grant/revoke). Leave unset to disable the integration entirely.
      REMNAWAVE_API_URL: ${REMNAWAVE_API_URL:-}
      REMNAWAVE_API_TOKEN: ${REMNAWAVE_API_TOKEN:-}
      # Off by default - traffic usage is a coarser, more sensitive number
      # than "does this account still have access".
      SHOW_TRAFFIC_USAGE: ${SHOW_TRAFFIC_USAGE:-false}
      # Optional branded logo. Unset by default (no logo). See
      # .env.example. Resolved against the container's cwd if relative
      # (WORKDIR /app per the Dockerfile) - use an absolute path here
      # (e.g. /app/data/logo.png, landing in the ./data bind mount below)
      # to not depend on that.
      BRANDED_LOGO_PATH: ${BRANDED_LOGO_PATH:-}
      # "before" (own message ahead of the menu) or "caption" (attached to
      # the menu message itself). See .env.example.
      BRANDED_LOGO_MODE: ${BRANDED_LOGO_MODE:-before}
      # Optional, explicit per-locale logo overrides - one env var per
      # locale this project ships (locales/ru, locales/en). Without these,
      # a `logo_<locale><same extension>` file next to BRANDED_LOGO_PATH is
      # picked up automatically if present (e.g. logo_ru.png next to
      # logo.png) - these only need setting to point a locale at a path
      # that doesn't follow that convention. See .env.example.
      BRANDED_LOGO_PATH_RU: ${BRANDED_LOGO_PATH_RU:-}
      BRANDED_LOGO_PATH_EN: ${BRANDED_LOGO_PATH_EN:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Pinned explicitly: some hosts default the Docker daemon to the
    # "journald" driver, which has a reader-attachment race that can make
    # `docker logs`/`docker compose logs` show nothing for a container after
    # it's recreated under the same name (confirmed directly - the data is
    # present in the journal via `journalctl`, `docker logs` just misses it).
    # json-file doesn't have this race. This service is the only one Watchtower
    # ever recreates, so it's the only one that actually hits this.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    # No HTTP server to probe (long-polling bot) - liveness is "the event
    # loop is still ticking", via a file touched every 30s (heartbeat.py).
    # start_period covers startup (deps sync, locale compile) before the
    # first heartbeat write.
    healthcheck:
      test: ["CMD", "python3", "-c", "import pathlib,sys,time; p=pathlib.Path('/app/data/.heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Auto-deploy: polls ghcr.io for a newer "bot" image and recreates the
  # container when one appears. Only touches containers with the
  # watchtower.enable label above, so it's safe next to unrelated containers
  # on a shared host. Not needed for local dev - only relevant on the server.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: proxy_bot_watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      # The image's bundled Docker SDK defaults to a very old API version
      # (1.25) that some hosts' daemons refuse ("client version 1.25 is too
      # old"). Pin it explicitly; override in .env if your host needs a
      # different floor (check with: docker version --format '{{.Server.APIVersion}}').
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.41}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    # --health-check is watchtower's own self-check mode, meant to be exec'd
    # into the already-running container (not passed as the main command).
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prod FSM backend. Not started by default - opt in with:
  #   FSM_BACKEND=redis REDIS_URL=redis://redis:6379/0 docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: proxy_bot_redis
    restart: unless-stopped
    profiles: ["redis"]
    # --maxmemory kept below the container's hard memory limit so Redis
    # evicts keys on its own terms instead of getting OOM-killed by cgroups.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
