# Custom-emoji definitions, shared by every locale's .ftl file (via Fluent
# `{ $emoji_<name> }` variables, injected automatically - see
# utils/i18n.py: EmojiFluentCompileCore) and by dialogs/common.py's
# CUSTOM_EMOJI (inline-keyboard button icons).
#
# Each value is either a "[tg_emoji:<id>:<shortcode>]" tag minted by
# scripts/generate_emoji_pack.py, or a literal Unicode emoji overriding the
# pack entirely for that name (e.g. `language = "🌐"`) - a plain override
# has no id, so a button using it (dialogs/common.py: icon(name)) falls
# back to showing no icon rather than erroring; message text renders the
# literal character either way.
#
# Regenerating the pack (uv run --group emoji-pack
# scripts/generate_emoji_pack.py) rewrites this file directly - any entry
# rewritten to a literal override here is preserved rather than clobbered
# back to a tag.
[emoji]
arrow_backward = "[tg_emoji:5447619450322856534:arrow_backward]"
